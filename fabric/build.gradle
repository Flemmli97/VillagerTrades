plugins {
    id 'net.fabricmc.fabric-loom'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version '2.+'
    id 'io.github.flemmli97.multiloader.platform-fabric'
}

loom {
    runs {
        client {
            vmArgs "-XX:+AllowEnhancedClassRedefinition"
        }
    }
}

repositories {
    maven {
        name = 'Fabric-Permission-API'
        url 'https://oss.sonatype.org/content/repositories/snapshots'
        content {
            includeGroup 'me.lucko'
        }
    }
}

dependencies {
    implementation "me.lucko:fabric-permissions-api:${rootProject.fabric_permissions_api}"

    implementation include("io.github.flemmli97:lingua_bib:${lingua_bib}-fabric")
}